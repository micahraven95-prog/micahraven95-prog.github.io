<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BoldT Team, the developer of LipTry, a virtual lip color try-on app.">
  <meta name="theme-color" content="#F7F2E9">
  <meta name="color-scheme" content="light">
  <title>BoldT Team</title>
  <link rel="canonical" href="https://micahraven95-prog.github.io/">
  <style>
    :root {
      --paper: #f7f2e9;
      --ink: #3b2725;
      --muted: #74554f;
      --accent: #8a4134;
      --line: #e5d6cc;
      --card: #fffaf5;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .shell { width: 100%; max-width: 720px; margin: 0 auto; padding: 0 24px; }
    header { padding-top: 28px; }
    .wordmark { font-family: Georgia, "Times New Roman", serif; font-size: 22px; color: var(--ink); text-decoration: none; }
    main { flex: 1; padding-top: 12vh; padding-bottom: 48px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(34px, 7vw, 48px); line-height: 1.12; }
    .intro { margin: 0 0 32px; color: var(--muted); font-size: 18px; }
    .card { padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); }
    .card h2 { margin: 0 0 6px; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 24px; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .links a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .links a:hover, .links a:focus-visible { background: var(--ink); color: var(--paper); }
    footer { padding-bottom: 28px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="shell">
    <a class="wordmark" href="./">BoldT Team</a>
  </header>
  <main class="shell">
    <p class="eyebrow">Developer</p>
    <h1>BoldT Team</h1>
    <p class="intro">We make simple, thoughtful tools that help you find colors that feel like you.</p>
    <section class="card" aria-labelledby="liptry-title">
      <h2 id="liptry-title">LipTry</h2>
      <p>Pick any color from a photo and try it on your lips, with photos processed on your device.</p>
      <ul class="links">
        <li><a href="https://micahraven95-prog.github.io/LipTry-Privacy/privacy.html">Privacy Policy</a></li>
        <li><a href="mailto:boldt.studio88@gmail.com">Contact us</a></li>
      </ul>
    </section>
  </main>
  <footer class="shell">
    <p>&copy; 2026 BoldT Team &middot; <a href="mailto:boldt.studio88@gmail.com">boldt.studio88@gmail.com</a></p>
  </footer>
</body>
</html>
